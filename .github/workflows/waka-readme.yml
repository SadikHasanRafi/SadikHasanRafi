name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          # ==========================
          # Required
          # ==========================
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # ==========================
          # Localization
          # ==========================
          LOCALE: "en"

          # ==========================
          # README Section
          # ==========================
          SECTION_NAME: "waka"

          # ==========================
          # General
          # ==========================
          SHOW_SHORT_INFO: "true"
          SHOW_PROFILE_VIEWS: "true"
          SHOW_UPDATED_DATE: "true"
          UPDATED_DATE_FORMAT: "%d %b %Y %H:%M UTC"

          # ==========================
          # Coding
          # ==========================
          SHOW_LINES_OF_CODE: "true"
          SHOW_TOTAL_CODE_TIME: "true"

          # ==========================
          # Commit Analytics
          # ==========================
          SHOW_COMMIT: "true"
          SHOW_DAYS_OF_WEEK: "true"

          # ==========================
          # WakaTime
          # ==========================
          SHOW_LANGUAGE: "true"
          SHOW_EDITORS: "true"
          SHOW_OS: "true"
          SHOW_PROJECTS: "false"
          SHOW_TIMEZONE: "true"
          SHOW_LANGUAGE_PER_REPO: "false"

          # ==========================
          # GitHub Analytics
          # ==========================
          SHOW_LOC_CHART: "true"

          # ==========================
          # Progress Bar
          # ==========================
          SYMBOL_VERSION: "2"

          # ==========================
          # Repository Filtering
          # ==========================
          MAX_REPOS: "100"
          IGNORED_REPOS: ""

          # ==========================
          # Commit Settings
          # ==========================
          COMMIT_BY_ME: "false"
          COMMIT_MESSAGE: "📊 Updated WakaTime development metrics"

          # Optional
          # COMMIT_USERNAME: "your-username"
          # COMMIT_EMAIL: "your@email.com"
