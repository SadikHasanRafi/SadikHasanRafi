name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SHOW_TITLE: true
          TIME_RANGE: last_6_months
          LANG_COUNT: 10
          SHOW_TOTAL: true
          SHOW_TIME: true
          BLOCKS: █
          STOP_AT_OTHER: true
          IGNORED_LANGUAGES: JSON YAML TOML